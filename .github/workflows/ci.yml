name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcode-select -p
          swift --version
      - name: Lint
        run: swift format lint -r -s Sources Tests Tools Package.swift
      - name: Test
        run: swift test
      - name: Build the app
        run: ./build.sh
